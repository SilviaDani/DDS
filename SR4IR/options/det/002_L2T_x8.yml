name: 002_L2T_x8_woPCGrad_30epochs_3warmup_ODVirat
model_type: lr_det
num_threads: 16
print_freq: 100  # unit: iter
scale: 8
manual_seed: 100
deterministic: true
# test_only: true

# data and augmentation
data:
  path: datasets/VOC_COCO
  format: coco
  aspect_ratio_group_factor : 3
  data_augmentation:
    - hflip
    - photometric
    - scale_jitter
    - iou_crop
    - zoomout
    - shortest_size
  is_voc: true

# network specs
network_det:
  name: fasterrcnn_mobilenet_v3_large_fpn
  weights_backbone: MobileNet_V3_Large_Weights.IMAGENET1K_V1
  #weights: DEFAULT
  num_classes: 5 #od virat 5 #pascal 21

# path for pretrained model
path:
  network_det: ~

# training config
train:  
  batch_size: 8  # 1 GPU
  epoch: 30
  save_freq: 10  # unit: epoch
  eval_freq: 10

  # optimizer
  optim_det:
    type: SGD
    lr: !!float 2e-2
    momentum: 0.9
    weight_decay: !!float 1e-4
  
  # scheduler
  scheduler:
    type: cosineannealinglr
    T_max: 30
    eta_min: !!float 1e-4

  # losses
  det_opt:
    type: DETLoss
    loss_weight: !!float 1.0

# testing config
test:  
  batch_size: 1
  calculate_lpips: True

# DDP setting
dist_url: env:://
